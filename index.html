<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Live Tally</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body id="body" class="bg-gray-100 text-gray-800 font-sans transition-colors duration-300 min-h-screen flex flex-col">

    <div id="main-container" class="max-w-4xl mx-auto my-6 flex-grow w-full bg-white rounded-lg shadow-md overflow-hidden transition-all duration-300">
        
        <!-- Header -->
        <div id="main-header" class="bg-blue-600 p-4 text-white flex justify-between items-center">
            <h1 class="text-2xl font-bold">Simple Live Tally</h1>
            <div class="flex items-center gap-4">
                <div id="status" class="text-sm opacity-75 bg-blue-800 px-2 py-1 rounded">Not authenticated</div>
                <a href="#tv" target="_blank" class="text-sm bg-white text-blue-600 hover:bg-gray-100 font-semibold py-1 px-3 rounded inline-flex items-center shadow-sm">
                    <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
                    TV Display
                </a>
            </div>
        </div>

        <!-- Login Section -->
        <div id="login-section" class="p-8 text-center block">
            <p id="login-text" class="mb-4 text-gray-600">Connect to Dropbox to start tallying votes.</p>
            <button onclick="startAuthFlow()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded shadow">
                Authenticate with Dropbox
            </button>
        </div>

        <!-- App Section -->
        <div id="app-section" class="p-6 hidden h-full flex-col">
            
            <!-- ADMIN CONTROLS (Hidden in TV Mode) -->
            <div id="admin-controls">
                
                <!-- Setup & Configuration Grid -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
                    
                    <!-- Event Management -->
                    <div class="p-4 bg-gray-50 border rounded-lg">
                        <h3 class="text-lg font-semibold mb-3 border-b pb-2">Event Configuration</h3>
                        
                        <div class="mb-4">
                            <label class="block text-sm font-medium text-gray-700 mb-1">Active Event</label>
                            <select id="active-event-select" onchange="changeActiveEvent()" class="w-full p-2 border rounded shadow-sm bg-white"></select>
                        </div>
                        
                        <div class="space-y-2 border-t pt-3">
                            <p class="text-sm font-medium text-gray-600">Create New Event</p>
                            <input type="text" id="new-event-name" placeholder="Event Name" class="w-full p-2 border rounded shadow-sm text-sm">
                            <div class="flex gap-2">
                                <input type="date" id="new-event-start" class="w-full p-2 border rounded shadow-sm text-sm" title="Start Date">
                                <input type="date" id="new-event-end" class="w-full p-2 border rounded shadow-sm text-sm" title="End Date">
                            </div>
                            <button onclick="addEvent()" class="w-full bg-gray-800 hover:bg-gray-900 text-white font-semibold py-1.5 rounded shadow-sm text-sm">
                                Create Event
                            </button>
                        </div>
                    </div>

                    <!-- Entity Management -->
                    <div class="p-4 bg-gray-50 border rounded-lg">
                        <h3 class="text-lg font-semibold mb-3 border-b pb-2">Entity Management</h3>
                        <div class="space-y-2">
                            <p class="text-sm font-medium text-gray-600">Register New Entity</p>
                            <input type="text" id="new-ent-public" placeholder="Public Name (e.g. Team Alpha)" class="w-full p-2 border rounded shadow-sm text-sm">
                            <input type="text" id="new-ent-private" placeholder="Private Name (Optional)" class="w-full p-2 border rounded shadow-sm text-sm">
                            <input type="url" id="new-ent-img" placeholder="Image URL (Optional)" class="w-full p-2 border rounded shadow-sm text-sm">
                            <button onclick="addEntity()" class="w-full bg-gray-800 hover:bg-gray-900 text-white font-semibold py-1.5 rounded shadow-sm text-sm">
                                Add Entity
                            </button>
                        </div>
                    </div>

                </div>

                <!-- Transaction Entry -->
                <div class="mb-8 p-4 bg-blue-50 border border-blue-100 rounded-lg shadow-sm">
                    <h2 class="text-xl font-semibold mb-4 text-blue-900">Add Transaction</h2>
                    <div class="flex flex-wrap gap-4 items-end">
                        <div class="flex-1 min-w-[200px]">
                            <label class="block text-sm font-medium text-gray-700 mb-1">Entity</label>
                            <select id="entity-select" class="w-full p-2 border rounded shadow-sm bg-white"></select>
                        </div>
                        <div class="flex-1 min-w-[150px]">
                            <label class="block text-sm font-medium text-gray-700 mb-1">Amount ($)</label>
                            <input type="number" id="amount-input" class="w-full p-2 border rounded shadow-sm bg-white" step="0.01" placeholder="0.00">
                        </div>
                        <button onclick="submitTransaction()" id="submit-btn" class="bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-8 rounded shadow-sm w-full md:w-auto">
                            Submit Vote
                        </button>
                    </div>
                    <div id="entry-message" class="text-sm mt-2 hidden font-medium"></div>
                </div>

            </div>

            <!-- Leaderboard (Visible in both modes) -->
            <div class="h-full flex flex-col flex-grow">
                <div class="flex justify-between items-end mb-6 border-b border-gray-200 pb-2" id="leaderboard-header">
                    <div>
                        <h2 id="leaderboard-title" class="text-xl font-semibold transition-all">Live Leaderboard</h2>
                        <p id="leaderboard-subtitle" class="text-sm text-gray-500 font-medium"></p>
                    </div>
                    <span id="countdown" class="text-sm opacity-50 font-mono">Refreshing in 60s...</span>
                </div>
                <div id="leaderboard" class="space-y-4 flex-1">
                    <!-- Progress bars injected here -->
                </div>
            </div>

        </div>
    </div>

    <!-- Footer -->
    <footer id="main-footer" class="text-center text-sm text-gray-500 py-6 mt-auto">
        <p class="font-medium">Simple Live Tally <span class="font-bold">v1.1.0</span></p>
        <p class="mt-2 space-x-2">
            <a href="https://github.com/adambeltz2/Simple-Live-Tally" target="_blank" class="text-blue-600 hover:text-blue-800 hover:underline">GitHub</a>
            <span>|</span>
            <a href="https://www.buymeacoffee.com/adambeltz" target="_blank" class="text-blue-600 hover:text-blue-800 hover:underline">Buy Me a Coffee</a>
            <span>|</span>
            <a href="javascript:window.open(window.location.pathname, '_blank')" class="text-blue-600 hover:text-blue-800 hover:underline">Admin View</a>
        </p>
    </footer>

    <script>
        // --- CONFIGURATION ---
        const CLIENT_ID = 'p6ejl1ht6k9gni2'; 
        const isLocalhost = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
        const REDIRECT_URI = isLocalhost ? window.location.origin + window.location.pathname : 'https://adambeltz2.github.io/Simple-Live-Tally/'; 
        const FILE_PATH = '/data.json';
        
        let accessToken = null;
        let currentRev = null;
        let appData = null;
        let refreshTimer = 60;

        // Structured Schema Initialization
        const defaultData = {
            events: [
                { id: "evt_" + Date.now(), name: "Inaugural Event", startDate: "", endDate: "" }
            ],
            activeEventId: "", // Assigned dynamically on load if empty
            entities: [
                { id: "ent_1", namePublic: "Team Alpha", namePrivate: "Internal Alpha", imageUrl: "", color: "bg-red-500" },
                { id: "ent_2", namePublic: "Team Beta", namePrivate: "Internal Beta", imageUrl: "", color: "bg-blue-500" }
            ],
            transactions: []
        };

        const colors = ['bg-red-500', 'bg-blue-500', 'bg-green-500', 'bg-yellow-500', 'bg-purple-500', 'bg-pink-500', 'bg-indigo-500', 'bg-teal-500', 'bg-orange-500'];

        // --- VIEW MODE MANAGEMENT (ADMIN vs TV) ---
        function checkViewMode() {
            const isTvMode = window.location.hash === '#tv';
            const body = document.getElementById('body');
            const container = document.getElementById('main-container');
            const header = document.getElementById('main-header');
            const adminControls = document.getElementById('admin-controls');
            const title = document.getElementById('leaderboard-title');
            const subtitle = document.getElementById('leaderboard-subtitle');
            const leaderboardHeader = document.getElementById('leaderboard-header');
            
            if (isTvMode) {
                body.classList.replace('bg-gray-100', 'bg-gray-900');
                body.classList.replace('text-gray-800', 'text-white');
                container.classList.replace('max-w-4xl', 'max-w-full');
                container.classList.replace('my-6', 'my-0');
                container.classList.replace('bg-white', 'bg-gray-900');
                container.classList.replace('shadow-md', 'shadow-none');
                container.classList.add('h-screen', 'p-8', 'rounded-none');
                
                header.classList.add('hidden');
                adminControls.classList.add('hidden');
                leaderboardHeader.classList.replace('border-gray-200', 'border-gray-700');
                
                title.classList.replace('text-xl', 'text-5xl');
                subtitle.classList.replace('text-gray-500', 'text-gray-400');
                subtitle.classList.add('text-xl', 'mt-2');
            } else {
                body.classList.replace('bg-gray-900', 'bg-gray-100');
                body.classList.replace('text-white', 'text-gray-800');
                container.classList.replace('max-w-full', 'max-w-4xl');
                container.classList.replace('my-0', 'my-6');
                container.classList.replace('bg-gray-900', 'bg-white');
                container.classList.replace('shadow-none', 'shadow-md');
                container.classList.remove('h-screen', 'p-8', 'rounded-none');
                
                header.classList.remove('hidden');
                adminControls.classList.remove('hidden');
                leaderboardHeader.classList.replace('border-gray-700', 'border-gray-200');
                
                title.classList.replace('text-5xl', 'text-xl');
                subtitle.classList.replace('text-gray-400', 'text-gray-500');
                subtitle.classList.remove('text-xl', 'mt-2');
            }

            if (appData) renderApp();
        }

        window.addEventListener('hashchange', checkViewMode);

        // --- AUTHENTICATION (PKCE FLOW) ---
        function generateRandomString(length) {
            const array = new Uint32Array(length / 2);
            window.crypto.getRandomValues(array);
            return Array.from(array, dec => ('0' + dec.toString(16)).substr(-2)).join('');
        }

        async function generateCodeChallenge(codeVerifier) {
            const encoder = new TextEncoder();
            const data = encoder.encode(codeVerifier);
            const digest = await window.crypto.subtle.digest('SHA-256', data);
            return btoa(String.fromCharCode.apply(null, new Uint8Array(digest)))
                .replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
        }

        async function startAuthFlow() {
            const codeVerifier = generateRandomString(64);
            window.localStorage.setItem('pkce_verifier', codeVerifier);
            const codeChallenge = await generateCodeChallenge(codeVerifier);
            const authUrl = `https://www.dropbox.com/oauth2/authorize?client_id=${CLIENT_ID}&response_type=code&code_challenge=${codeChallenge}&code_challenge_method=S256&redirect_uri=${encodeURIComponent(REDIRECT_URI)}`;
            window.location.href = authUrl;
        }

        async function handleAuthRedirect() {
            const params = new URLSearchParams(window.location.search);
            const code = params.get('code');
            if (code) {
                const newUrl = window.location.pathname + window.location.hash;
                window.history.replaceState({}, document.title, newUrl); 
                const codeVerifier = window.localStorage.getItem('pkce_verifier');
                
                const response = await fetch('https://api.dropboxapi.com/oauth2/token', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: new URLSearchParams({
                        client_id: CLIENT_ID,
                        grant_type: 'authorization_code',
                        code: code,
                        redirect_uri: REDIRECT_URI,
                        code_verifier: codeVerifier
                    })
                });

                const data = await response.json();
                if (data.access_token) {
                    window.localStorage.setItem('dropbox_token', data.access_token);
                    initApp();
                }
            }
        }

        // --- DROPBOX FILE OPERATIONS ---
        async function fetchState() {
            try {
                const response = await fetch('https://content.dropboxapi.com/2/files/download', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${accessToken}`,
                        'Dropbox-API-Arg': JSON.stringify({ path: FILE_PATH })
                    }
                });

                if (response.status === 409) { 
                    appData = defaultData;
                    if(!appData.activeEventId) appData.activeEventId = appData.events[0].id;
                    await saveState();
                    return;
                }
                
                if (!response.ok) throw new Error('Failed to fetch from Dropbox');

                currentRev = JSON.parse(response.headers.get('Dropbox-API-Result')).rev;
                appData = await response.json();
                
                // Fallback for migrations
                if(!appData.events) appData = { ...defaultData, ...appData, events: defaultData.events };
                if(!appData.activeEventId && appData.events.length > 0) appData.activeEventId = appData.events[0].id;
                
                renderApp();
            } catch (error) {
                console.error("Error fetching state:", error);
            }
        }

        async function saveState() {
            const mode = currentRev ? { ".tag": "update", "update": currentRev } : "add";
            const response = await fetch('https://content.dropboxapi.com/2/files/upload', {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${accessToken}`,
                    'Content-Type': 'application/octet-stream',
                    'Dropbox-API-Arg': JSON.stringify({
                        path: FILE_PATH,
                        mode: mode,
                        autorename: false,
                        mute: true
                    })
                },
                body: JSON.stringify(appData)
            });

            if (response.status === 409) return false; 
            const result = await response.json();
            currentRev = result.rev;
            return true;
        }

        // --- DATA MANAGEMENT LOGIC ---

        async function addEvent() {
            const name = document.getElementById('new-event-name').value;
            const startDate = document.getElementById('new-event-start').value;
            const endDate = document.getElementById('new-event-end').value;
            
            if (!name) return alert("Event Name is required.");
            
            await fetchState();
            const newId = 'evt_' + Date.now();
            appData.events.push({ id: newId, name, startDate, endDate });
            appData.activeEventId = newId; // Auto switch to new event
            await saveState();
            
            document.getElementById('new-event-name').value = '';
            document.getElementById('new-event-start').value = '';
            document.getElementById('new-event-end').value = '';
            renderApp();
        }

        async function addEntity() {
            const namePublic = document.getElementById('new-ent-public').value;
            const namePrivate = document.getElementById('new-ent-private').value;
            const imageUrl = document.getElementById('new-ent-img').value;
            
            if (!namePublic) return alert("Public Name is required.");
            
            await fetchState();
            const randomColor = colors[Math.floor(Math.random() * colors.length)];
            
            appData.entities.push({ 
                id: 'ent_' + Date.now(), 
                namePublic, 
                namePrivate, 
                imageUrl, 
                color: randomColor 
            });
            await saveState();
            
            document.getElementById('new-ent-public').value = '';
            document.getElementById('new-ent-private').value = '';
            document.getElementById('new-ent-img').value = '';
            renderApp();
        }

        async function changeActiveEvent() {
            const select = document.getElementById('active-event-select');
            await fetchState();
            appData.activeEventId = select.value;
            await saveState();
            renderApp();
        }

        async function submitTransaction() {
            const btn = document.getElementById('submit-btn');
            const msg = document.getElementById('entry-message');
            const entityId = document.getElementById('entity-select').value;
            const amount = parseFloat(document.getElementById('amount-input').value);

            if (!entityId || isNaN(amount)) return;

            btn.disabled = true;
            btn.innerText = "Saving...";

            await fetchState();

            appData.transactions.push({
                id: 'txn_' + Date.now(),
                createDate: new Date().toISOString(),
                modifiedDate: new Date().toISOString(),
                entityId: entityId,
                eventId: appData.activeEventId,
                amount: amount
            });

            const success = await saveState();
            
            if (success) {
                msg.textContent = "Transaction saved successfully.";
                msg.className = "text-sm mt-2 text-green-600 block";
                document.getElementById('amount-input').value = '';
                renderApp(); 
            } else {
                msg.textContent = "Data conflict. Retrying automatically...";
                msg.className = "text-sm mt-2 text-red-600 block";
                setTimeout(() => submitTransaction(), 1000); 
            }

            setTimeout(() => { msg.className = "hidden"; }, 3000);
            btn.disabled = false;
            btn.innerText = "Submit Vote";
            refreshTimer = 60;
        }

        // --- RENDER LOGIC ---

        function renderApp() {
            if (!appData) return;
            const isTvMode = window.location.hash === '#tv';
            
            // 1. Populate Event Dropdown & Subtitle
            const eventSelect = document.getElementById('active-event-select');
            eventSelect.innerHTML = '';
            let activeEventName = "Unknown Event";
            
            appData.events.forEach(evt => {
                const option = document.createElement('option');
                option.value = evt.id;
                option.text = evt.name;
                if (evt.id === appData.activeEventId) {
                    option.selected = true;
                    activeEventName = evt.name;
                }
                eventSelect.appendChild(option);
            });
            document.getElementById('leaderboard-subtitle').innerText = `Active Event: ${activeEventName}`;

            // 2. Populate Entity Dropdown
            const entitySelect = document.getElementById('entity-select');
            entitySelect.innerHTML = '';
            appData.entities.forEach(ent => {
                const option = document.createElement('option');
                option.value = ent.id;
                option.text = ent.namePublic;
                entitySelect.appendChild(option);
            });

            // 3. Calculate Totals (Scoping to Active Event)
            const totals = {};
            appData.entities.forEach(e => totals[e.id] = 0);
            
            const activeTransactions = appData.transactions.filter(t => t.eventId === appData.activeEventId);
            activeTransactions.forEach(t => {
                if(totals[t.entityId] !== undefined) totals[t.entityId] += t.amount;
            });

            // 4. Render Leaderboard
            const sortedEntities = [...appData.entities].sort((a, b) => totals[b.id] - totals[a.id]);
            const maxTotal = Math.max(...Object.values(totals), 10); // Floor of 10 to prevent visually empty bars

            const board = document.getElementById('leaderboard');
            board.innerHTML = '';

            // Dynamic TV Mode Classes
            const tagPadding = isTvMode ? 'py-2 px-6 text-2xl' : 'py-1 px-3 text-sm';
            const valSize = isTvMode ? 'text-4xl' : 'text-sm';
            const barHeight = isTvMode ? 'h-16 mb-8' : 'h-6 mb-4';
            const badgeBg = isTvMode ? 'bg-gray-800 text-gray-200 border border-gray-700' : 'bg-white text-gray-700 border border-gray-200';
            const valColor = isTvMode ? 'text-white' : 'text-gray-800';
            const trackBg = isTvMode ? 'bg-gray-800' : 'bg-gray-200';

            sortedEntities.forEach(ent => {
                const amount = totals[ent.id];
                const percentage = Math.min((amount / maxTotal) * 100, 100);
                
                // Optional Image logic
                const imgHtml = ent.imageUrl 
                    ? `<img src="${ent.imageUrl}" alt="${ent.namePublic}" class="w-8 h-8 rounded-full mr-2 inline-block object-cover border border-gray-300">` 
                    : '';

                board.innerHTML += `
                    <div class="relative pt-1">
                        <div class="flex mb-2 items-center justify-between">
                            <div class="flex items-center">
                                ${isTvMode && ent.imageUrl ? `<img src="${ent.imageUrl}" class="w-12 h-12 rounded-full mr-4 inline-block object-cover border-2 border-gray-600">` : imgHtml}
                                <span class="font-semibold inline-block uppercase rounded-full shadow-sm ${badgeBg} ${tagPadding}">
                                    ${ent.namePublic}
                                </span>
                            </div>
                            <div class="text-right">
                                <span class="font-bold inline-block ${valColor} ${valSize}">
                                    $${amount.toFixed(2)}
                                </span>
                            </div>
                        </div>
                        <div class="overflow-hidden flex rounded-full ${trackBg} ${barHeight} shadow-inner">
                            <div style="width:${percentage}%" class="shadow-none flex flex-col text-center whitespace-nowrap text-white justify-center ${ent.color || 'bg-blue-500'} transition-all duration-1000 ease-out"></div>
                        </div>
                    </div>
                `;
            });
        }

        function initApp() {
            checkViewMode();
            
            accessToken = window.localStorage.getItem('dropbox_token');
            if (accessToken) {
                document.getElementById('login-section').classList.replace('block', 'hidden');
                document.getElementById('app-section').classList.replace('hidden', 'flex');
                document.getElementById('status').innerText = 'Connected';
                
                fetchState();

                setInterval(() => {
                    refreshTimer--;
                    document.getElementById('countdown').innerText = `Refreshing in ${refreshTimer}s...`;
                    if (refreshTimer <= 0) {
                        document.getElementById('countdown').innerText = 'Refreshing now...';
                        fetchState();
                        refreshTimer = 60;
                    }
                }, 1000);
            } else {
                handleAuthRedirect();
            }
        }

        window.onload = initApp;
    </script>
</body>
</html>
