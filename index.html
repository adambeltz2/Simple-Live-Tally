<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Live Tally</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans p-6">

    <div class="max-w-3xl mx-auto bg-white rounded-lg shadow-md overflow-hidden">
        
        <!-- Header -->
        <div class="bg-blue-600 p-4 text-white flex justify-between items-center">
            <h1 class="text-2xl font-bold">Simple Live Tally</h1>
            <div id="status" class="text-sm opacity-75">Not authenticated</div>
        </div>

        <!-- Login Section -->
        <div id="login-section" class="p-8 text-center block">
            <p class="mb-4 text-gray-600">Connect to Dropbox to start tallying votes.</p>
            <button onclick="startAuthFlow()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded">
                Authenticate with Dropbox
            </button>
        </div>

        <!-- App Section -->
        <div id="app-section" class="p-6 hidden">
            
            <!-- Entry Form -->
            <div class="mb-8 p-4 bg-gray-50 border rounded-lg">
                <h2 class="text-xl font-semibold mb-4">Add Transaction</h2>
                <div class="flex gap-4 items-end">
                    <div class="flex-1">
                        <label class="block text-sm font-medium text-gray-700 mb-1">Entity</label>
                        <select id="entity-select" class="w-full p-2 border rounded shadow-sm"></select>
                    </div>
                    <div class="flex-1">
                        <label class="block text-sm font-medium text-gray-700 mb-1">Amount ($)</label>
                        <input type="number" id="amount-input" class="w-full p-2 border rounded shadow-sm" step="0.01">
                    </div>
                    <button onclick="submitTransaction()" id="submit-btn" class="bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-6 rounded shadow-sm">
                        Add
                    </button>
                </div>
                <div id="entry-message" class="text-sm mt-2 hidden"></div>
            </div>

            <!-- Leaderboard -->
            <div>
                <div class="flex justify-between items-end mb-4">
                    <h2 class="text-xl font-semibold">Live Leaderboard</h2>
                    <span id="countdown" class="text-sm text-gray-500">Refreshing in 60s...</span>
                </div>
                <div id="leaderboard" class="space-y-4">
                    <!-- Progress bars injected here -->
                </div>
            </div>

        </div>
    </div>

    <script>
        // --- CONFIGURATION ---
        const CLIENT_ID = 'p6ejl1ht6k9gni2'; 
        
        // Dynamically handles localhost testing vs production GitHub Pages deployment
        const isLocalhost = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
        const REDIRECT_URI = isLocalhost ? window.location.origin + window.location.pathname : 'https://adambeltz2.github.io/Simple-Live-Tally/'; 
        
        const FILE_PATH = '/data.json';
        
        let accessToken = null;
        let currentRev = null;
        let appData = null;
        let refreshTimer = 60;

        // Default skeleton if file doesn't exist
        const defaultData = {
            event: { name: "Live Event", targetGoal: 1000 },
            entities: [
                { id: "1", name: "Team Alpha", color: "bg-red-500" },
                { id: "2", name: "Team Beta", color: "bg-blue-500" }
            ],
            transactions: []
        };

        // --- AUTHENTICATION (PKCE FLOW) ---
        
        function generateRandomString(length) {
            const array = new Uint32Array(length / 2);
            window.crypto.getRandomValues(array);
            return Array.from(array, dec => ('0' + dec.toString(16)).substr(-2)).join('');
        }

        async function generateCodeChallenge(codeVerifier) {
            const encoder = new TextEncoder();
            const data = encoder.encode(codeVerifier);
            const digest = await window.crypto.subtle.digest('SHA-256', data);
            return btoa(String.fromCharCode.apply(null, new Uint8Array(digest)))
                .replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
        }

        async function startAuthFlow() {
            const codeVerifier = generateRandomString(64);
            window.localStorage.setItem('pkce_verifier', codeVerifier);
            const codeChallenge = await generateCodeChallenge(codeVerifier);
            
            const authUrl = `https://www.dropbox.com/oauth2/authorize?client_id=${CLIENT_ID}&response_type=code&code_challenge=${codeChallenge}&code_challenge_method=S256&redirect_uri=${encodeURIComponent(REDIRECT_URI)}`;
            window.location.href = authUrl;
        }

        async function handleAuthRedirect() {
            const params = new URLSearchParams(window.location.search);
            const code = params.get('code');
            
            if (code) {
                window.history.replaceState({}, document.title, REDIRECT_URI); 
                const codeVerifier = window.localStorage.getItem('pkce_verifier');
                
                const response = await fetch('https://api.dropboxapi.com/oauth2/token', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: new URLSearchParams({
                        client_id: CLIENT_ID,
                        grant_type: 'authorization_code',
                        code: code,
                        redirect_uri: REDIRECT_URI,
                        code_verifier: codeVerifier
                    })
                });

                const data = await response.json();
                if (data.access_token) {
                    window.localStorage.setItem('dropbox_token', data.access_token);
                    initApp();
                }
            }
        }

        // --- DROPBOX FILE OPERATIONS ---

        async function fetchState() {
            try {
                const response = await fetch('https://content.dropboxapi.com/2/files/download', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${accessToken}`,
                        'Dropbox-API-Arg': JSON.stringify({ path: FILE_PATH })
                    }
                });

                if (response.status === 409) { 
                    // File not found, initialize it
                    appData = defaultData;
                    await saveState();
                    return;
                }
                
                if (!response.ok) {
                    throw new Error('Failed to fetch from Dropbox');
                }

                currentRev = JSON.parse(response.headers.get('Dropbox-API-Result')).rev;
                appData = await response.json();
                renderApp();
            } catch (error) {
                console.error("Error fetching state:", error);
            }
        }

        async function saveState() {
            const mode = currentRev ? { ".tag": "update", "update": currentRev } : "add";
            
            const response = await fetch('https://content.dropboxapi.com/2/files/upload', {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${accessToken}`,
                    'Content-Type': 'application/octet-stream',
                    'Dropbox-API-Arg': JSON.stringify({
                        path: FILE_PATH,
                        mode: mode,
                        autorename: false,
                        mute: true
                    })
                },
                body: JSON.stringify(appData)
            });

            if (response.status === 409) {
                return false; // Conflict! Someone else wrote to the file.
            }

            const result = await response.json();
            currentRev = result.rev;
            return true;
        }

        // --- APPLICATION LOGIC ---

        async function submitTransaction() {
            const btn = document.getElementById('submit-btn');
            const msg = document.getElementById('entry-message');
            const entityId = document.getElementById('entity-select').value;
            const amount = parseFloat(document.getElementById('amount-input').value);

            if (!entityId || isNaN(amount)) return;

            btn.disabled = true;
            btn.innerText = "Saving...";

            await fetchState();

            appData.transactions.push({
                id: 'txn_' + Date.now(),
                entityId: entityId,
                amount: amount,
                timestamp: new Date().toISOString()
            });

            const success = await saveState();
            
            if (success) {
                msg.textContent = "Transaction added successfully!";
                msg.className = "text-sm mt-2 text-green-600 block";
                document.getElementById('amount-input').value = '';
                renderApp(); 
            } else {
                msg.textContent = "Conflict detected. Retrying...";
                msg.className = "text-sm mt-2 text-red-600 block";
                setTimeout(() => submitTransaction(), 1000); 
            }

            setTimeout(() => { msg.className = "hidden"; }, 3000);
            btn.disabled = false;
            btn.innerText = "Add";
            
            refreshTimer = 60;
        }

        function renderApp() {
            const select = document.getElementById('entity-select');
            
            // Populate Dropdown if empty
            if (select.children.length === 0) {
                appData.entities.forEach(ent => {
                    const option = document.createElement('option');
                    option.value = ent.id;
                    option.text = ent.name;
                    select.appendChild(option);
                });
            }

            // Calculate Totals
            const totals = {};
            appData.entities.forEach(e => totals[e.id] = 0);
            appData.transactions.forEach(t => {
                if(totals[t.entityId] !== undefined) totals[t.entityId] += t.amount;
            });

            // Sort Entities by Total Descending
            const sortedEntities = [...appData.entities].sort((a, b) => totals[b.id] - totals[a.id]);
            
            // Find highest total for relative bar scaling
            const maxTotal = Math.max(...Object.values(totals), appData.event.targetGoal || 1);

            // Render Leaderboard
            const board = document.getElementById('leaderboard');
            board.innerHTML = '';

            sortedEntities.forEach(ent => {
                const amount = totals[ent.id];
                const percentage = Math.min((amount / maxTotal) * 100, 100);

                board.innerHTML += `
                    <div class="relative pt-1">
                        <div class="flex mb-2 items-center justify-between">
                            <div>
                                <span class="text-xs font-semibold inline-block py-1 px-2 uppercase rounded-full text-gray-600 bg-gray-200">
                                    ${ent.name}
                                </span>
                            </div>
                            <div class="text-right">
                                <span class="text-xs font-semibold inline-block text-gray-600">
                                    $${amount.toFixed(2)}
                                </span>
                            </div>
                        </div>
                        <div class="overflow-hidden h-4 mb-4 text-xs flex rounded bg-gray-200">
                            <div style="width:${percentage}%" class="shadow-none flex flex-col text-center whitespace-nowrap text-white justify-center ${ent.color || 'bg-blue-500'} transition-all duration-500"></div>
                        </div>
                    </div>
                `;
            });
        }

        function initApp() {
            accessToken = window.localStorage.getItem('dropbox_token');
            if (accessToken) {
                document.getElementById('login-section').classList.replace('block', 'hidden');
                document.getElementById('app-section').classList.replace('hidden', 'block');
                document.getElementById('status').innerText = 'Connected to Dropbox';
                
                fetchState();

                setInterval(() => {
                    refreshTimer--;
                    document.getElementById('countdown').innerText = `Refreshing in ${refreshTimer}s...`;
                    if (refreshTimer <= 0) {
                        document.getElementById('countdown').innerText = 'Refreshing now...';
                        fetchState();
                        refreshTimer = 60;
                    }
                }, 1000);
            } else {
                handleAuthRedirect();
            }
        }

        window.onload = initApp;
    </script>
</body>
</html>
